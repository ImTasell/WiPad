name: Desktop

on:
  push:
    paths:
      - "desktop/**"
      - "protocol/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Slint Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libfontconfig1-dev libfreetype6-dev libxkbcommon-dev \
            libwayland-dev libx11-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Check formatting
        working-directory: desktop
        run: cargo fmt --all -- --check
      - name: Run tests
        working-directory: desktop
        run: cargo test
      - name: Run Clippy
        working-directory: desktop
        run: cargo clippy --all-targets -- -D warnings
      - name: Build debug binary
        working-directory: desktop
        run: cargo build
      - name: Build optimized Linux binary
        working-directory: desktop
        run: cargo build --release
      - name: Package Linux test build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/wipad-linux-x86_64
          install -m 0755 desktop/target/release/wipad-desktop dist/wipad-linux-x86_64/wipad-desktop
          cat > dist/wipad-linux-x86_64/TESTING.txt <<'EOF'
          WiPad Linux x86_64 test build

          Run:
            chmod +x wipad-desktop
            ./wipad-desktop

          This is an unsigned development build, not a system installer.
          It does not install services or change device permissions.
          The desktop app needs access to /dev/uinput to create a virtual gamepad.
          Do not run the GUI as root. Configure uinput access separately.

          This build is dynamically linked. If startup reports a missing shared
          library, install the matching Fedora runtime package and try again.
          EOF
          tar -C dist -czf dist/wipad-linux-x86_64.tar.gz wipad-linux-x86_64
      - name: Upload Linux desktop test build
        uses: actions/upload-artifact@v4
        with:
          name: wipad-linux-x86_64
          path: dist/wipad-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 14
