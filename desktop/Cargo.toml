[package]
name = "wipad-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
build = "build.rs"

[dependencies]
mdns-sd = "0.22.0"
evdev = "0.13.2"
slint = "1.19.0"
uuid = { version = "1.18.1", features = ["v4"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.14.10", default-features = false, features = ["ring"] }
x509-parser = "0.18.1"
sha2 = "0.10.9"
time = { version = "0.3.44", features = ["std"] }
zeroize = "1.8.2"

[build-dependencies]
slint-build = "1.19.0"
